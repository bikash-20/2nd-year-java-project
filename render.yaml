# Rentify — Render Deployment Configuration
# Auto-deploys from GitHub on every push to main branch

services:
  - type: web
    name: rentify
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    autoDeploy: true
    branch: main
    envVars:
      - key: PORT
        value: 8080
      # REQUIRED for the AI chatbot (all models, including free ones).
      # Set this in the Render dashboard → Environment.
      - key: OPENROUTER_API_KEY
        sync: false
